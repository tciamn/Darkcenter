# Nginx config for futurelabs.social (Mastodon)
# Place at: /etc/nginx/sites-available/futurelabs.social
# Enable with: ln -s /etc/nginx/sites-available/futurelabs.social /etc/nginx/sites-enabled/
# Run certbot FIRST to generate SSL cert before enabling this config.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream mastodon_web {
  server 127.0.0.1:3000 fail_timeout=0;
}

upstream mastodon_streaming {
  server 127.0.0.1:4000 fail_timeout=0;
  least_conn;
}

# Redirect HTTP → HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name futurelabs.social;

  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$server_name$request_uri; }
}

# Main HTTPS server
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name futurelabs.social;

  ssl_certificate     /etc/letsencrypt/live/futurelabs.social/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/futurelabs.social/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache   shared:MozSSL:10m;
  ssl_session_tickets off;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
  ssl_prefer_server_ciphers off;

  add_header Strict-Transport-Security "max-age=63072000" always;
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options DENY;
  add_header X-XSS-Protection "1; mode=block";
  add_header Referrer-Policy "same-origin";

  keepalive_timeout 70;
  sendfile on;
  client_max_body_size 99m;

  # Docker Compose setup: static assets are served from inside the container.
  # All requests proxy through; cache headers applied at the nginx layer.
  root /opt/mastodon/public;

  gzip on;
  gzip_disable "msie6";
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_buffers 16 8k;
  gzip_http_version 1.1;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml image/x-icon;

  location / {
    try_files $uri @proxy;
  }

  location ~ ^/(emoji|packs|sounds) {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=63072000" always;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Proxy "";
    proxy_pass http://mastodon_web;
    proxy_buffering on;
    proxy_redirect off;
    proxy_http_version 1.1;
  }

  location ^~ /api/v1/streaming {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Proxy "";

    proxy_pass http://mastodon_streaming;
    proxy_buffering off;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    tcp_nodelay on;
  }

  location @proxy {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Proxy "";
    proxy_pass_header Server;

    proxy_pass http://mastodon_web;
    proxy_buffering on;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_connect_timeout 90s;
  }

  error_page 500 501 502 503 504 /500.html;
}
