<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Darkcenter">
<meta name="theme-color" content="#0a0e0f">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: blob:; manifest-src blob: data:; worker-src blob:">
<link id="manifest-placeholder" rel="manifest">
<title>Darkcenter Terminal</title>
<style>
  :root {
    --bg: #0a0e0f;
    --bg2: #0d1214;
    --sidebar-bg: #080c0d;
    --green: #2ecc71;
    --green-dim: rgba(46,204,113,0.18);
    --green-glow: rgba(46,204,113,0.08);
    --amber: #f39c12;
    --red: #e74c3c;
    --blue: #3498db;
    --text: #c8dcc8;
    --text-dim: #688868;
    --text-mid: #7a9a7a;
    --border: #1a2e1a;
    --cursor: #2ecc71;
    --sel: rgba(46,204,113,0.15);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
    --sidebar-w: 220px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :focus-visible {
    outline: 2px solid var(--green);
    outline-offset: 2px;
    border-radius: 2px;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Scanline overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,0.025) 2px, rgba(0,0,0,0.025) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  /* ── LAYOUT ── */
  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
    padding-left: var(--safe-left);
    padding-right: var(--safe-right);
  }

  /* Top bar */
  #topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    height: 44px;
    background: var(--sidebar-bg);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  #topbar-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #menu-btn {
    display: none;
    background: none;
    border: none;
    color: var(--green);
    font-size: 18px;
    cursor: pointer;
    padding: 4px 8px;
    line-height: 1;
  }

  #topbar-title {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: var(--green);
    text-transform: uppercase;
  }

  #topbar-title span {
    color: var(--text-dim);
    font-weight: 300;
  }

  #topbar-meta {
    font-size: 0.6rem;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }

  #clock {
    font-size: 0.65rem;
    color: var(--text-mid);
    letter-spacing: 0.08em;
  }

  /* Main panel area */
  #panels {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── SIDEBAR ── */
  #sidebar {
    width: var(--sidebar-w);
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
    transition: transform 0.25s ease;
  }

  #sidebar-header {
    padding: 12px 14px 8px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  #sidebar-header .sh-label {
    font-size: 0.55rem;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  #search-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 0.7rem;
    padding: 5px 8px;
    outline: none;
    border-radius: 2px;
  }

  #search-input:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 1px var(--green-dim);
  }

  #search-input::placeholder { color: var(--text-dim); }

  #state-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
  }

  #state-list::-webkit-scrollbar { width: 3px; }
  #state-list::-webkit-scrollbar-track { background: transparent; }
  #state-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .state-item {
    display: flex;
    align-items: center;
    padding: 11px 14px;
    cursor: pointer;
    gap: 10px;
    border-left: 2px solid transparent;
    transition: background 0.1s, border-color 0.1s;
    min-height: 44px;
  }

  .state-item:hover, .state-item.active {
    background: var(--green-glow);
    border-left-color: var(--green);
  }

  .state-item.active .si-abbr { color: var(--green); }
  .state-item.active .si-name { color: var(--text); }

  .si-abbr {
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--text-mid);
    width: 24px;
    flex-shrink: 0;
  }

  .si-name {
    font-size: 0.65rem;
    color: var(--text-dim);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .si-count {
    font-size: 0.55rem;
    color: var(--text-dim);
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 1px 4px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  #sidebar-footer {
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .sf-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 0 9px 6px;
    cursor: pointer;
    font-size: 0.65rem;
    color: var(--text-dim);
    border-left: 2px solid transparent;
    transition: color 0.1s, border-color 0.1s;
    min-height: 44px;
  }

  .sf-item:hover, .sf-item.active {
    color: var(--amber);
    border-left-color: var(--amber);
  }

  .sf-item.active { color: var(--amber); }

  /* ── TERMINAL MAIN ── */
  #terminal {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
  }

  #term-output {
    flex: 1;
    overflow-y: auto;
    padding: 18px 22px;
    line-height: 1.6;
    user-select: text;
    -webkit-user-select: text;
  }

  #term-output::-webkit-scrollbar { width: 4px; }
  #term-output::-webkit-scrollbar-track { background: transparent; }
  #term-output::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Terminal command line */
  #term-input-row {
    display: flex;
    align-items: center;
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    gap: 8px;
    flex-shrink: 0;
    background: var(--bg2);
  }

  #term-prompt {
    color: var(--green);
    font-size: 0.75rem;
    font-weight: 600;
    white-space: nowrap;
    letter-spacing: 0.05em;
  }

  #term-input {
    flex: 1;
    background: none;
    border: none;
    color: var(--text);
    font-family: inherit;
    font-size: 0.75rem;
    outline: none;
    caret-color: var(--cursor);
  }

  #term-input::placeholder { color: var(--text-dim); }

  #run-btn {
    background: var(--green-dim);
    border: 1px solid var(--green);
    color: var(--green);
    font-family: inherit;
    font-size: 0.65rem;
    font-weight: 600;
    padding: 5px 12px;
    cursor: pointer;
    letter-spacing: 0.08em;
    border-radius: 2px;
    transition: background 0.15s;
  }

  #run-btn:hover { background: rgba(46,204,113,0.28); }
  #run-btn:active { background: rgba(46,204,113,0.4); }

  /* ── TERMINAL CONTENT ELEMENTS ── */
  .t-prompt { color: var(--green); font-size: 0.72rem; }
  .t-cmd { color: var(--text); font-size: 0.72rem; }
  .t-comment { color: var(--text-dim); font-size: 0.7rem; }

  .t-section {
    margin: 18px 0 6px;
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    padding-bottom: 4px;
  }

  .t-title {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--green);
    letter-spacing: 0.06em;
    margin: 8px 0 2px;
  }

  .t-subtitle {
    font-size: 0.7rem;
    color: var(--text-mid);
    margin-bottom: 16px;
  }

  .t-block {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--green);
    padding: 12px 16px;
    margin: 8px 0;
    border-radius: 0 2px 2px 0;
  }

  .t-block.amber { border-left-color: var(--amber); }
  .t-block.red { border-left-color: var(--red); }
  .t-block.blue { border-left-color: var(--blue); }

  .t-block-label {
    font-size: 0.55rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  .t-val {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--green);
    line-height: 1.1;
  }

  .t-val.amber { color: var(--amber); }
  .t-val.red { color: var(--red); }
  .t-val.blue { color: var(--blue); }

  .t-val-sub {
    font-size: 0.62rem;
    color: var(--text-dim);
    margin-top: 3px;
  }

  .t-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin: 8px 0;
  }

  .t-grid-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin: 8px 0;
  }

  .t-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 5px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.7rem;
  }

  .t-row:last-child { border-bottom: none; }
  .t-row-label { color: var(--text-dim); }
  .t-row-val { color: var(--text); font-weight: 600; }
  .t-row-val.green { color: var(--green); }
  .t-row-val.amber { color: var(--amber); }
  .t-row-val.red { color: var(--red); }

  .t-bar-wrap {
    margin: 4px 0 12px;
  }

  .t-bar-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.6rem;
    color: var(--text-dim);
    margin-bottom: 3px;
  }

  .t-bar-track {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .t-bar-fill {
    height: 100%;
    background: var(--green);
    border-radius: 2px;
    transition: width 0.6s ease;
  }

  .t-bar-fill.amber { background: var(--amber); }
  .t-bar-fill.red { background: var(--red); }

  .t-note {
    font-size: 0.62rem;
    color: var(--text-dim);
    border-left: 2px solid var(--border);
    padding-left: 10px;
    margin: 10px 0;
    line-height: 1.5;
  }

  .t-table {
    width: 100%;
    border-collapse: collapse;
    margin: 10px 0;
    font-size: 0.65rem;
  }

  .t-table th {
    text-align: left;
    color: var(--text-dim);
    font-size: 0.55rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 4px 10px 6px 0;
    border-bottom: 1px solid var(--border);
    font-weight: 400;
  }

  .t-table td {
    padding: 5px 10px 5px 0;
    border-bottom: 1px solid rgba(26,46,26,0.5);
    color: var(--text);
  }

  .t-table tr:last-child td { border-bottom: none; }
  .t-table td.dim { color: var(--text-dim); }
  .t-table td.grn { color: var(--green); }
  .t-table td.amb { color: var(--amber); }
  .t-table td.red { color: var(--red); }

  .blink {
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }

  .t-error {
    color: var(--red);
    font-size: 0.7rem;
    padding: 6px 0;
  }

  .t-success {
    color: var(--green);
    font-size: 0.7rem;
    padding: 6px 0;
  }

  /* ── SPLASH / BOOT SCREEN ── */
  #boot {
    display: flex;
    flex-direction: column;
    gap: 2px;
    font-size: 0.68rem;
  }

  .boot-line { color: var(--text-dim); }
  .boot-line.grn { color: var(--green); }
  .boot-line.amb { color: var(--amber); }

  /* ── NATIONAL TOTALS HERO ── */
  .hero-ascii {
    font-size: 0.52rem;
    color: var(--green);
    line-height: 1.15;
    letter-spacing: 0.02em;
    margin-bottom: 10px;
    opacity: 0.7;
  }

  /* ── PORTRAIT / MOBILE sidebar overlay ── */
  #sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
  }

  /* ── RESPONSIVE ── */

  /* iPad portrait (768px) */
  @media (max-width: 900px) {
    :root { --sidebar-w: 190px; }

    #menu-btn { display: block; }

    #sidebar {
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      z-index: 200;
      transform: translateX(-100%);
      padding-top: var(--safe-top);
    }

    #sidebar.open {
      transform: translateX(0);
    }

    #sidebar-overlay.show { display: block; }

    .t-grid-3 { grid-template-columns: 1fr 1fr; }
  }

  /* Small phone fallback */
  @media (max-width: 480px) {
    :root { --sidebar-w: 240px; }
    .t-grid { grid-template-columns: 1fr; }
    .t-grid-3 { grid-template-columns: 1fr; }
    #topbar-meta { display: none; }
  }

  /* iPad landscape optimization */
  @media (min-width: 1024px) {
    :root { --sidebar-w: 240px; }
    .t-grid-3 { grid-template-columns: 1fr 1fr 1fr; }
    #term-output { padding: 22px 28px; }
  }

  @media (min-width: 1200px) {
    :root { --sidebar-w: 260px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .blink { animation: none; opacity: 1; }
    .t-bar-fill { transition: none; }
    #sidebar { transition: none; }
    * { transition-duration: 0.01ms !important; }
  }
</style>
</head>

<div id="sidebar-overlay" onclick="closeSidebar()"></div>

<div id="app">

  <!-- Top bar -->
  <div id="topbar">
    <div id="topbar-left">
      <button id="menu-btn" onclick="toggleSidebar()" aria-label="Open state selector" aria-expanded="false" aria-controls="sidebar">&#9776;</button>
      <div id="topbar-title">DARK<span>CENTER</span> / terminal</div>
    </div>
    <div id="topbar-meta">2,820 US data centers &bull; 30 states</div>
    <div style="display:flex;align-items:center;gap:10px">
      <div id="offline-pill" hidden style="font-size:0.55rem;letter-spacing:0.1em;padding:2px 7px;border-radius:10px;background:rgba(243,156,18,0.15);color:#f39c12;border:1px solid rgba(243,156,18,0.4)">OFFLINE</div>
      <div id="clock"></div>
    </div>
  </div>

  <div id="panels">

    <!-- Sidebar -->
    <nav id="sidebar" aria-label="State selector">
      <div id="sidebar-header">
        <div class="sh-label" aria-hidden="true">// filter states</div>
        <input type="search" id="search-input" aria-label="Search states" placeholder="search..." oninput="filterStates(this.value)" autocomplete="off" autocorrect="off" spellcheck="false">
      </div>
      <div id="state-list" role="list"></div>
      <div id="sidebar-footer" role="list">
        <div class="sf-item" id="sf-national" role="listitem" tabindex="0" onclick="showNational()" onkeydown="if(event.key==='Enter'||event.key===' ')showNational()">&#9679; NATIONAL TOTALS</div>
        <div class="sf-item" id="sf-table" role="listitem" tabindex="0" onclick="showTable()" onkeydown="if(event.key==='Enter'||event.key===' ')showTable()">&#9632; ALL STATES TABLE</div>
        <div class="sf-item" id="sf-sources" role="listitem" tabindex="0" onclick="showSources()" onkeydown="if(event.key==='Enter'||event.key===' ')showSources()">&#9650; DATA SOURCES</div>
        <div class="sf-item" id="sf-about" role="listitem" tabindex="0" onclick="showAbout()" onkeydown="if(event.key==='Enter'||event.key===' ')showAbout()">&#9670; ABOUT</div>
      </div>
    </nav>

    <!-- Terminal -->
    <main id="terminal">
      <div id="term-output" role="log" aria-live="polite" aria-label="Terminal output" aria-relevant="additions"></div>
      <div id="term-input-row">
        <div id="term-prompt" aria-hidden="true">darkcenter&nbsp;$</div>
        <input type="text" id="term-input" aria-label="Command input" placeholder="type a state abbr or command (help)..." spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" onkeydown="handleInput(event)">
        <button id="run-btn" aria-label="Run command" onclick="runCommand()">RUN</button>
      </div>
    </main>

  </div>
</div>

// Helpers
const escHtml = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt = (n, dec=0) => n == null ? 'N/A' : Number(n).toLocaleString('en-US', {minimumFractionDigits: dec, maximumFractionDigits: dec});
const fmtMW = mw => mw >= 1000 ? `${(mw/1000).toFixed(1)} GW` : `${fmt(mw)} MW`;
const fmtCO2 = mt => mt >= 1e9 ? `${(mt/1e9).toFixed(2)} GT` : `${(mt/1e6).toFixed(1)} MT`;
const pct = (v, max) => Math.min(100, Math.round((v/max)*100));

const out = document.getElementById('term-output');
const maxCap = Math.max(...DATA.states.map(s => s.capacity_mw_low));
const maxDeaths = Math.max(...DATA.states.map(s => s.deaths_low));

function write(html) {
  out.innerHTML = html;
  out.scrollTop = 0;
}

function bar(val, max, cls='') {
  const p = pct(val, max);
  return `<div class="t-bar-track"><div class="t-bar-fill ${cls}" style="width:${p}%"></div></div>`;
}

function stateRank(s, field) {
  const sorted = [...DATA.states].sort((a,b) => b[field] - a[field]);
  return sorted.findIndex(x => x.state === s.state) + 1;
}

    const abbr = el.querySelector('.si-abbr').textContent.toLowerCase();
    const name = el.querySelector('.si-name').textContent.toLowerCase();
    el.style.display = (!term || abbr.includes(term) || name.includes(term)) ? '' : 'none';
  });
}

function setActiveState(abbr) {
  document.querySelectorAll('.state-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.sf-item').forEach(el => el.classList.remove('active'));
  if (abbr) {
    const el = document.getElementById(`si-${abbr}`);
    if (el) { el.classList.add('active'); el.scrollIntoView({block:'nearest'}); }
  }
}

function setActiveFooter(id) {
  document.querySelectorAll('.sf-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.state-item').forEach(el => el.classList.remove('active'));
  const el = document.getElementById(id);
  if (el) el.classList.add('active');
}

// ── SIDEBAR TOGGLE (portrait) ──
function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sidebar-overlay');
  const btn = document.getElementById('menu-btn');
  const open = sb.classList.toggle('open');
  ov.classList.toggle('show', open);
  if (btn) { btn.setAttribute('aria-expanded', open); btn.setAttribute('aria-label', open ? 'Close state selector' : 'Open state selector'); }
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('show');
  const btn = document.getElementById('menu-btn');
  if (btn) { btn.setAttribute('aria-expanded', 'false'); btn.setAttribute('aria-label', 'Open state selector'); }
}

// ── COMMAND INPUT ──
function handleInput(e) {
  if (e.key === 'Enter') runCommand();
}

function runCommand() {
  const input = document.getElementById('term-input');
  const raw = input.value.trim();
  input.value = '';
  if (!raw) return;

  const cmd = raw.toUpperCase().replace(/^--STATE\s+/, '');

  if (['HELP','H','?'].includes(cmd)) { showHelp(); return; }
  if (['NATIONAL','NAT','N','TOTALS'].includes(cmd)) { showNational(); return; }
  if (['TABLE','LIST','ALL'].includes(cmd)) { showTable(); return; }
  if (['SOURCES','SOURCE','DATA'].includes(cmd)) { showSources(); return; }
  if (['ABOUT','INFO'].includes(cmd)) { showAbout(); return; }
  if (['CLEAR','RESET','BOOT'].includes(cmd)) { showBoot(); setActiveState(null); document.querySelectorAll('.sf-item').forEach(e=>e.classList.remove('active')); return; }

  const s = DATA.states.find(x => x.state === cmd || x.name.toUpperCase() === cmd);
  if (s) { showState(s); return; }

  write(`<div class="t-prompt">&gt; ${escHtml(raw)}</div>
         <div class="t-error">command not found: ${escHtml(raw.toLowerCase())}</div>
         <div class="t-comment">type  help  to see available commands</div>
         <div class="t-comment">state codes: ${DATA.states.map(s=>s.state).join(' ')}</div>
         <div class="t-prompt" style="margin-top:10px">&gt; <span class="blink">&#9646;</span></div>`);
}

// ── CLOCK ──
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false});
}
setInterval(updateClock, 1000);
updateClock();

// ── OFFLINE STATUS ──
function setOnlineStatus() {
  const pill = document.getElementById('offline-pill');
  if (pill) pill.hidden = navigator.onLine;
}
window.addEventListener('online', setOnlineStatus);
window.addEventListener('offline', setOnlineStatus);
setOnlineStatus();

// ── MANIFEST (inline, dynamic — required for iOS home screen) ──
(function() {
  const manifest = {
    name: 'Darkcenter Terminal',
    short_name: 'Darkcenter',
    description: 'U.S. data center energy, emissions & health impact tool',
    start_url: location.href,
    display: 'standalone',
    background_color: '#0a0e0f',
    theme_color: '#0a0e0f',
    orientation: 'any',
    icons: [
      { src: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%230a0e0f"/><text y="72" font-size="72" text-anchor="middle" x="50">🖥️</text></svg>', sizes: '512x512', type: 'image/svg+xml' }
    ]
  };
  try {
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    const el = document.getElementById('manifest-placeholder');
    if (el) el.href = URL.createObjectURL(blob);
  } catch(e) {}
})();

// ── KEYBOARD / VISUAL VIEWPORT ──
// Keeps the command input visible when soft keyboard appears on iPad
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => {
    const app = document.getElementById('app');
    if (app) app.style.height = window.visualViewport.height + 'px';
  });
}

// ── INIT ──
buildSidebar();
showBoot();
</script>
</body>
</html>
