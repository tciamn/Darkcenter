name: Sync Data from Google Sheets

on:
  schedule:
    - cron: '0 6 * * 1'   # Every Monday at 06:00 UTC
  workflow_dispatch:        # Allow manual runs from the GitHub Actions UI

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run sync script
        env:
          VITE_SHEETS_ID: ${{ secrets.VITE_SHEETS_ID }}
          VITE_SHEETS_API_KEY: ${{ secrets.VITE_SHEETS_API_KEY }}
        run: node scripts/sync-data.js

      - name: Commit updated fallback data if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/fallback.json
          git diff --staged --quiet || \
            git commit -m "chore: sync fallback data from Google Sheets [skip ci]"
          git push
